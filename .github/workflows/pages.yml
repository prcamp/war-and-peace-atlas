name: Publish reading atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript and source data
        run: |
          node --check dist/app.js
          node --check dist/workspace.js
          node --check dist/atlas.js
          node --check dist/campaign.js
          node validate.cjs
          node validate-campaign.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage the same layout as branch-based Pages
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R dist _site/dist
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
